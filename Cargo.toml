[package]
name = "mic_filter"
version = "0.1.0"
edition = "2024"
description = "Real-time microphone conditioner: RNNoise → expander → compressor → VB-Cable"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1"
atomic_float = "1"
cpal = "0.15"
directories = "5"
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
nnnoiseless = "0.5"
parking_lot = "0.12"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
